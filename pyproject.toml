[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openscenesense-ollama"
version = "1.2.0"
description = "Local video analysis with Ollama vision and optional Whisper audio"
authors = [{name = "Rohit Yelukati Mahendra", email = "mahendrarohittigon@gmail.com"}]
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
keywords = ["video-analysis", "computer-vision", "ollama", "local-ai", "multimodal"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=2.0.2,<3",
    "opencv-python>=4.10.0.84,<6",
    "pillow>=11.0.0,<13",
    "requests>=2.32.3,<3",
    "ffmpeg-python>=0.2.0,<0.3",
]

[project.optional-dependencies]
audio = [
    "torch>=2.5.1,<3",
    "transformers>=4.46.1,<6",
]
dev = [
    "build>=1.2,<2",
    "jsonschema>=4.23,<5",
    "pytest>=8,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.12,<1",
    "twine>=7,<8",
]

[project.scripts]
openscenesense-ollama = "openscenesense_ollama.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["openscenesense_ollama"]

[tool.hatch.build.targets.sdist]
exclude = [
    "/.coverage",
    "/.env",
    "/dist",
    "/Examples/*.avi",
    "/Examples/*.mp4",
    "/Examples/*.wav",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[project.urls]
Homepage = "https://github.com/ymrohit/openscenesense-ollama"
Documentation = "https://github.com/ymrohit/openscenesense-ollama/tree/master/Docs"
Changelog = "https://github.com/ymrohit/openscenesense-ollama/blob/master/CHANGELOG.md"
Repository = "https://github.com/ymrohit/openscenesense-ollama.git"
"Bug Tracker" = "https://github.com/ymrohit/openscenesense-ollama/issues"
